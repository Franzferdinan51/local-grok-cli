name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

# One in-flight run per ref so tag+main piles do not starve the release matrix.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: grok-local (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            artifact: grok-local-linux-x86_64
          - name: macos-apple-silicon
            os: macos-latest
            rust_target: aarch64-apple-darwin
            artifact: grok-local-macos-aarch64
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact: grok-local-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.rust_target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export PROTOC
        if: runner.os != 'Windows'
        shell: bash
        run: echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Export PROTOC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = (Get-Command protoc).Source
          Add-Content -Path $env:GITHUB_ENV -Value "PROTOC=$p"

      - name: Install DotSlash (Unix)
        if: runner.os != 'Windows'
        run: cargo install dotslash --locked

      - name: Build grok-local
        run: cargo build -p xai-grok-pager-bin --release --target ${{ matrix.rust_target }}

      - name: Version
        shell: bash
        run: |
          t="${{ matrix.rust_target }}"
          if [ -f "target/${t}/release/grok-local.exe" ]; then
            "./target/${t}/release/grok-local.exe" --version
          else
            "./target/${t}/release/grok-local" --version
          fi

      - name: Stage artifact
        shell: bash
        run: |
          t="${{ matrix.rust_target }}"
          mkdir -p dist
          if [ -f "target/${t}/release/grok-local.exe" ]; then
            cp "target/${t}/release/grok-local.exe" "dist/${{ matrix.artifact }}"
          else
            cp "target/${t}/release/grok-local" "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    # Publish whatever platforms built. A Windows-only failure used to skip
    # this job, so /releases kept showing only v0.2.0 after v0.3.x tags.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # Matrix legs that failed have no artifact; still publish the rest.
          pattern: grok-local-*

      - name: Require at least one binary
        run: |
          shopt -s nullglob
          files=(artifacts/grok-local-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no grok-local artifacts to publish" >&2
            exit 1
          fi
          ls -lh artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/grok-local-*
          generate_release_notes: true
          fail_on_unmatched_files: false
          make_latest: true
