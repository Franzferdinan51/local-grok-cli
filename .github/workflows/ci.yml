name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: grok-local (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - name: macos-apple-silicon
            os: macos-latest
            rust_target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.rust_target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install DotSlash (Unix)
        if: runner.os != 'Windows'
        run: cargo install dotslash --locked

      - name: Build grok-local
        run: cargo build -p xai-grok-pager-bin --release --target ${{ matrix.rust_target }}

      - name: Version
        shell: bash
        run: |
          t="${{ matrix.rust_target }}"
          if [ -f "target/${t}/release/grok-local.exe" ]; then
            "./target/${t}/release/grok-local.exe" --version
          else
            "./target/${t}/release/grok-local" --version
          fi
