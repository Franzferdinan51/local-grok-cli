[toolchain]
channel = "1.94.0"
components = ["rustfmt", "clippy"]
profile = "default"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# rustup always adds the *host* triple. On Apple Silicon that is
# aarch64-apple-darwin (M1–M5 Pro/Max/Ultra). On Intel Mac it is
# x86_64-apple-darwin. Do not list those here: they would be downloaded on
# every Linux checkout.
